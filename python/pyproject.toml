[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "waybound"
version = "0.3.0"
description = "Zero-CDP, out-of-band OS-level browser automation SDK (macOS, Linux, Windows, Android)"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = []
keywords = ["browser-automation", "accessibility", "playwright", "mcp", "rust", "wayland", "macos", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Sekinal/waybound"
Repository = "https://github.com/Sekinal/waybound"
Issues = "https://github.com/Sekinal/waybound/issues"
Changelog = "https://github.com/Sekinal/waybound/releases"

[project.scripts]
waybound = "waybound.cli:main"
waybound-mcp = "waybound.mcp_server:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/waybound"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "TC",   # flake8-type-checking
  "RUF",  # ruff-specific rules
  "ANN",  # flake8-annotations (strict typing)
  "S",    # flake8-bandit (security)
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "ARG",  # flake8-unused-arguments
  "RET",  # flake8-return
  "C4",   # flake8-comprehensions
  "PIE",  # flake8-pie
  "PL",   # pylint subset
]
ignore = [
  "S101", # allow assert in tests (also overridden per-file)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers -W error"
