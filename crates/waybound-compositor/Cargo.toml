[package]
name = "waybound-compositor"
description = "Pure-Rust headless Wayland compositor for high-density normal-geometry browser concurrency"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
png = "0.17"
serde.workspace = true
tracing.workspace = true
waybound-core.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["event", "std"] }
tempfile = "3"
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-server = { version = "0.31", default-features = false }

[lints]
workspace = true
