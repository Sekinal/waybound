[package]
name = "waybound-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
replay = ["dep:tokio", "dep:waybound-http"]

[dependencies]
brotli.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
waybound-core.workspace = true
waybound-driver-android.workspace = true
waybound-driver-linux.workspace = true
waybound-driver-macos.workspace = true
waybound-driver-windows.workspace = true
waybound-http = { workspace = true, optional = true }
waybound-net.workspace = true

[lints]
workspace = true
