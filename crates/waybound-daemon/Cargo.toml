[package]
name = "waybound-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
replay = ["dep:serde", "dep:tokio", "dep:waybound-http"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json.workspace = true
signal-hook.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
waybound-compositor.workspace = true
waybound-core.workspace = true
waybound-driver-android.workspace = true
waybound-driver-linux.workspace = true
waybound-driver-macos.workspace = true
waybound-driver-windows.workspace = true
waybound-http = { workspace = true, optional = true }
waybound-net.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe `kill(2)` wrapper for asking Chrome to shut down; already in the tree via zbus.
rustix = { version = "1.1", default-features = false, features = ["process", "std"] }

[dev-dependencies]
brotli.workspace = true
flate2.workspace = true

[lints]
workspace = true
