[package]
name = "waybound-driver-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Both are already in the graph through `zbus`; used to pipeline AT-SPI2 calls.
futures-lite = { version = "2", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
png = "0.17"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
waybound-compositor.workspace = true
waybound-core.workspace = true
x11rb = { version = "0.13", features = ["xtest"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
