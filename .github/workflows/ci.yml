name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Build daemon for end-to-end tests
        run: cargo build -p waybound-daemon
        working-directory: .
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict typecheck
        run: uv run mypy src tests
      - name: Pytest
        # The end-to-end tests skip themselves when the daemon binary is missing. With the
        # daemon built above, any skip means they silently stopped running, so fail on it.
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -rs | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then
            echo "::error::tests were skipped; the daemon end-to-end tests must run in CI"
            exit 1
          fi

  windows-live-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Build waybound-daemon.exe
        run: cargo build -p waybound-daemon
      - name: Sync Python SDK
        working-directory: python
        run: uv sync --dev
      - name: Run live Windows Chrome UIA + SendInput smoke test
        working-directory: python
        run: uv run python ../scripts/windows_live_smoke.py
