name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-features

  cargo-deny:
    # Advisories, licences, bans and sources, configured in deny.toml.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # v2.1.1 bundles cargo-deny 0.20.2, the version deny.toml was checked against.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # The action's image ships Rust 1.85, older than the workspace MSRV (1.88).
          rust-version: stable

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build daemon for end-to-end tests
        run: cargo build -p waybound-daemon --features replay
        working-directory: .
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy strict typecheck
        run: uv run mypy src tests
      - name: Pytest
        # The end-to-end tests skip themselves when the daemon binary is missing. With the
        # daemon built above, any skip means they silently stopped running, so fail on it.
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -rs | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then
            echo "::error::tests were skipped; the daemon end-to-end tests must run in CI"
            exit 1
          fi

  windows-live-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Build waybound-daemon.exe
        run: cargo build -p waybound-daemon
      - name: Sync Python SDK
        working-directory: python
        run: uv sync --dev
      - name: Run live Windows Chrome UIA + SendInput smoke test
        working-directory: python
        run: uv run python ../scripts/windows_live_smoke.py

  linux-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install Linux display and AT-SPI2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            at-spi2-core \
            dbus-x11 \
            gir1.2-atspi-2.0 \
            python3-gi \
            scrot \
            xclip \
            xdotool \
            xvfb
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends chromium-browser
          fi
      - name: Build waybound-daemon
        run: cargo build -p waybound-daemon
      - name: Sync Python SDK
        working-directory: python
        run: uv sync --dev
      - name: Run live Linux Chrome AT-SPI2 + X11 smoke test
        working-directory: python
        env:
          ACCESSIBILITY_ENABLED: "1"
          GTK_MODULES: "gail:atk-bridge"
          QT_ACCESSIBILITY: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dbus-run-session -- bash -c '
            if [ -x /usr/libexec/at-spi-bus-launcher ]; then
              /usr/libexec/at-spi-bus-launcher --launch-immediately >/dev/null 2>&1 &
            elif [ -x /usr/lib/at-spi2-core/at-spi-bus-launcher ]; then
              /usr/lib/at-spi2-core/at-spi-bus-launcher --launch-immediately >/dev/null 2>&1 &
            fi
            sleep 0.5
            uv run python ../scripts/linux_live_smoke.py
          '

  typescript:
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/waybound-ts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build daemon for end-to-end tests
        run: cargo build -p waybound-daemon
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/waybound-ts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Biome lint and format check
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Tests
        # The daemon is built above, so a missing binary must fail the run rather than
        # silently skip the end-to-end tests.
        env:
          WAYBOUND_REQUIRE_DAEMON: "1"
        run: npm test
