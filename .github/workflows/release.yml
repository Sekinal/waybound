name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-daemon:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: waybound-daemon-macos-arm64
            bin: waybound-daemon
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: waybound-daemon-linux-x86_64
            bin: waybound-daemon
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: waybound-daemon-linux-arm64
            bin: waybound-daemon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: waybound-daemon-windows-x86_64
            bin: waybound-daemon.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release daemon
        run: cargo build --release --bin waybound-daemon --target ${{ matrix.target }}
      - name: Package tarball + SHA-256
        shell: bash
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/${{ matrix.artifact }}.tar.gz ${{ matrix.bin }}
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
            else
              shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.tar.gz.sha256"
            fi
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  build-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync root README for PyPI package description
        run: cp ../README.md README.md
      - name: Build Python sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/*

  publish-release:
    needs: [build-daemon, build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  publish-pypi:
    needs: [build-python, publish-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-container:
    needs: [publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch OCI image (Podman & Docker compatible)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sekinal/waybound:latest
            ghcr.io/sekinal/waybound:${{ github.ref_name }}
