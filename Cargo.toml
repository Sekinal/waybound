[workspace]
resolver = "3"
members = [
  "crates/waybound-core",
  "crates/waybound-daemon",
  "crates/waybound-driver-android",
  "crates/waybound-driver-linux",
  "crates/waybound-driver-macos",
  "crates/waybound-driver-windows",
  "crates/waybound-http",
  "crates/waybound-net",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
# None of these crates are published to crates.io; the daemon ships as release binaries.
publish = false

[workspace.dependencies]
brotli = "8.0"
flate2 = "1.1"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
signal-hook = { version = "0.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
waybound-core = { path = "crates/waybound-core" }
waybound-driver-android = { path = "crates/waybound-driver-android" }
waybound-driver-linux = { path = "crates/waybound-driver-linux" }
waybound-driver-macos = { path = "crates/waybound-driver-macos" }
waybound-driver-windows = { path = "crates/waybound-driver-windows" }
waybound-http = { path = "crates/waybound-http" }
waybound-net = { path = "crates/waybound-net" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_results = "warn"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "warn"
module_name_repetitions = "allow"
